services:
  # PostgreSQL Database Service
  db:
    image: postgres:13-alpine
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=Candidat_DB
      - POSTGRES_USER=anass
      - POSTGRES_PASSWORD=anassDB975@-]
      - POSTGRES_HOST_AUTH_METHOD=trust 
    ports:
      - "5432:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anass -d Candidat_DB"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Django Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: django_backend
    command: >
      sh -c "
      python manage.py makemigrations --noinput &&
      python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=anass975@Akl-]
      - DEBUG=True
      - POSTGRES_DB=Candidat_DB
      - POSTGRES_USER=anass
      - POSTGRES_PASSWORD=anassDB975@-]
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vite_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api 
    depends_on:
      - backend
    networks:
      - app_network

# Persistent Volumes
volumes:
  postgres_data:
    driver: local
  media_volume:
    driver: local

networks:
  app_network:
    driver: bridge